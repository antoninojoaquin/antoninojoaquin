<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&amp;family=Inter:wght@700&amp;display=swap');
            
            .name {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                font-size: 55px;
                font-weight: 700;
                fill: #ffffff;
            }
            
            .subtitle {
                font-family: 'Fira Code', monospace;
                font-size: 30px;
                fill: #00D1FF;
            }
            
            .cursor {
                stroke: #00D1FF;
                stroke-width: 3;
                animation: blink 1s step-end infinite;
            }
            
            @keyframes blink {
                0%, 100% { stroke-opacity: 1; }
                50% { stroke-opacity: 0; }
            }
        </style>

        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="45" />
        </filter>

        <linearGradient id="ray" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00D1FF" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#00D1FF" stop-opacity="0" />
        </linearGradient>

        <clipPath id="clip1">
            <rect x="-210" y="-35" width="0" height="50">
                <animate attributeName="width" values="0; 420; 420; 0; 0" keyTimes="0; 0.2; 0.45; 0.5; 1" dur="10s" repeatCount="indefinite" />
            </rect>
        </clipPath>
        <clipPath id="clip2">
            <rect x="-165" y="-35" width="0" height="50">
                <animate attributeName="width" values="0; 0; 330; 330; 0" keyTimes="0; 0.5; 0.66; 0.95; 1" dur="10s" repeatCount="indefinite" />
            </rect>
        </clipPath>
    </defs>

    <rect width="100%" height="100%" fill="#020813" />

    <g filter="url(#softGlow)">
        <ellipse cx="450" cy="-50" rx="350" ry="200" fill="#072242" />
        
        <polygon points="350,-50 550,-50 850,350 50,350" fill="url(#ray)" />
        <polygon points="420,-50 480,-50 650,350 250,350" fill="url(#ray)" />
    </g>

    <text x="450" y="140" class="name" text-anchor="middle">Antonino Joaquín</text>

    <g transform="translate(450, 200)">
        
        <g>
            <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.5; 0.501; 1" dur="10s" repeatCount="indefinite" />
            
            <text x="-210" y="0" class="subtitle" clip-path="url(#clip1)">Systems Analyst Student</text>
            
            <line class="cursor" x1="-210" y1="-25" x2="-210" y2="5">
                <animate attributeName="x1" values="-210; 210; 210; -210; -210" keyTimes="0; 0.2; 0.45; 0.5; 1" dur="10s" repeatCount="indefinite" />
                <animate attributeName="x2" values="-210; 210; 210; -210; -210" keyTimes="0; 0.2; 0.45; 0.5; 1" dur="10s" repeatCount="indefinite" />
            </line>
        </g>

        <g>
            <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.499; 0.5; 1" dur="10s" repeatCount="indefinite" />
            
            <text x="-165" y="0" class="subtitle" clip-path="url(#clip2)">Frontend Developer</text>
            
            <line class="cursor" x1="-165" y1="-25" x2="-165" y2="5">
                <animate attributeName="x1" values="-165; -165; 165; 165; -165" keyTimes="0; 0.5; 0.66; 0.95; 1" dur="10s" repeatCount="indefinite" />
                <animate attributeName="x2" values="-165; -165; 165; 165; -165" keyTimes="0; 0.5; 0.66; 0.95; 1" dur="10s" repeatCount="indefinite" />
            </line>
        </g>

    </g>
</svg>
