<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="6" viewBox="0 0 1000 6" role="img" aria-label="Cyan divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cyanLine" x1="0" x2="1">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00ffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .shine { animation: shine 3.5s ease-in-out infinite alternate; }
    @keyframes shine { from { opacity: .55; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none; opacity: .85; } }
  </style>
  <rect class="shine" x="0" y="0" width="1000" height="6" fill="url(#cyanLine)"/>
</svg>
